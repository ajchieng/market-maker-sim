[project]
name = "mmsim"
version = "0.1.0"
description = "Market-making simulator on a live Kraken order book"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
]

[project.scripts]
mm-record = "mmsim.record:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
